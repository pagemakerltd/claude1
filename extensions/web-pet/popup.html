<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="heads">
    <img class="preview" id="catImg" src="images/cat/icon.png" alt="แมว" />
    <img class="preview" id="dogImg" src="images/dog/icon.png" alt="หมา" />
  </div>
  <h1>Web Pet</h1>

  <p class="label">สัตว์เลี้ยง</p>
  <div class="who" role="radiogroup" aria-label="เลือกสัตว์เลี้ยง">
    <label><input type="radio" name="who" value="cat" /><span>🐱 แมว</span></label>
    <label><input type="radio" name="who" value="dog" /><span>🐶 หมา</span></label>
    <label><input type="radio" name="who" value="both" /><span>🐱🐶 ทั้งสอง</span></label>
  </div>
  <button id="addDog" type="button" class="wide">➕ เพิ่มน้องหมามาเล่นด้วย</button>
  <button id="playTogether" type="button" class="wide">🤝 ให้หมากับแมวเล่นด้วยกัน</button>

  <p class="label">คุยและจด</p>
  <div class="grid">
    <button id="chat" type="button">💬 คุยกับน้อง</button>
    <button id="notes" type="button">📝 โน้ต</button>
    <button id="sites" type="button">🌐 เว็บที่จำไว้</button>
    <button id="gohome" type="button">🏠 ไปนอน</button>
  </div>

  <p class="label">ของเล่น</p>
  <div class="toys">
    <button id="yarn" type="button" title="แมวชอบ">🧶</button>
    <button id="fish" type="button" title="แมวและหมาชอบ">🐟</button>
    <button id="bone" type="button" title="หมาชอบ">🦴</button>
    <button id="ball" type="button" title="แมวและหมาชอบ">🎾</button>
  </div>
  <p id="msg"></p>

  <p class="label">ตัวเลือก</p>
  <label class="switch"><input type="checkbox" id="enabled" /><span>แสดงสัตว์เลี้ยงบนหน้าเว็บ</span></label>
  <label class="switch"><input type="checkbox" id="home" /><span>มีบ้านให้นอน</span></label>
  <label class="switch"><input type="checkbox" id="playdate" /><span>ให้หมากับแมวชวนกันเล่นเอง</span></label>
  <label class="switch"><input type="checkbox" id="follow" /><span>วิ่งตามเมาส์</span></label>
  <label class="switch"><input type="checkbox" id="climb" /><span>ปีนขึ้นของบนหน้าเว็บ</span></label>
  <a href="#" id="options">⚙️ ตั้งค่า API key (สำหรับคุยกับน้อง)</a>

  <p class="hint">กดที่น้องเพื่อเล่น ลากเพื่อย้าย โยนไปบนของในหน้าเว็บได้<br />หน้าที่เปิดค้างไว้ก่อนติดตั้งต้อง refresh</p>
  <script src="popup.js"></script>
</body>
</html>
