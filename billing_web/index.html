<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบเสนอราคา / วางบิล</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1f2430;--mut:#6b7280;--line:#d9dce3;--acc:#2563eb;--danger:#e11d48;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--panel:#1d2027;--ink:#e8eaf0;--mut:#9aa1b0;--line:#323744;--acc:#6ea0ff;--danger:#ff6b8a;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Leelawadee UI",Tahoma,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 10px 0 0}
nav{display:flex;gap:2px}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px}
nav button.on{border-bottom-color:var(--acc);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--danger)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0;width:100%}
textarea{resize:vertical}
main{padding:14px;max-width:1180px;margin:0 auto}
.view{display:none}.view.on{display:block}
.bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
th{background:var(--bg);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid label,.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.hint{color:var(--mut);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ชำระแล้ว{color:var(--ok);border-color:var(--ok)}.pill.ยกเลิก{color:var(--danger);border-color:var(--danger)}
#items input{padding:3px 5px}
#items td{padding:2px 3px}
.tot{margin-left:auto;width:360px;max-width:100%}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-weight:700;font-size:16px;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:340px;max-width:92vw}
dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:20;max-width:90vw}
#printarea{display:none}
/* ---------- A4 document ---------- */
.doc{width:210mm;min-height:297mm;padding:14mm 14mm 12mm;background:#fff;color:#111;font:12.5px/1.45 "Leelawadee UI","Segoe UI",Tahoma,sans-serif;position:relative}
.doc h2{margin:0;font-size:22px;color:var(--dc)}
.doc .hd{display:flex;justify-content:space-between;gap:14px;border-bottom:3px solid var(--dc);padding-bottom:8px;margin-bottom:10px}
.doc .co{display:flex;gap:10px}.doc .co img{max-height:70px;max-width:110px;object-fit:contain}
.doc .meta td{border:none;padding:1px 0 1px 10px}
.doc .box{border:1px solid #bbb;border-radius:4px;padding:6px 8px;margin-bottom:10px}
.doc table.it{width:100%;border-collapse:collapse;background:none}
.doc table.it th{background:var(--dc);color:#fff;border:1px solid var(--dc);padding:4px 6px;text-align:center}
.doc table.it td{border:1px solid #bbb;padding:4px 6px}
.doc .sum{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.doc .sum table{background:none;width:260px}.doc .sum td{border:none;padding:2px 4px}
.doc .sum tr.b td{font-weight:700;border-top:2px solid #111}
.doc .txt{border:1px solid #bbb;padding:5px 8px;margin-top:6px;font-weight:600;background:#f3f3f3}
.doc .sign{display:flex;gap:20px;margin-top:34px;text-align:center}
.doc .sign div{flex:1;border-top:1px solid #333;padding-top:4px}
@media print{
 body>*:not(#printarea){display:none!important}
 #printarea{display:block}
 @page{size:A4;margin:0}
 .doc{box-shadow:none;break-after:page}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:700px){main{padding:8px}.tot{width:100%}}
</style>
</head>
<body>
<header>
 <h1>🧾 ใบเสนอราคา / วางบิล</h1>
 <nav id="nav"><button data-v="docs" class="on">เอกสาร</button><button data-v="cust">ลูกค้า</button><button data-v="prod">สินค้า/บริการ</button><button data-v="set">ตั้งค่า</button></nav>
 <span style="flex:1"></span>
 <button id="bBackup">สำรองข้อมูล</button><button id="bRestore">กู้คืน</button><input type="file" id="fRestore" accept=".json" hidden>
</header>
<main>
<!-- ============ DOCUMENT LIST ============ -->
<div class="view on" id="v_docs">
 <div class="bar">
  <button class="primary" data-new="QT">＋ ใบเสนอราคา</button><button data-new="BL">＋ ใบวางบิล</button><button data-new="INV">＋ ใบแจ้งหนี้/ใบกำกับภาษี</button><button data-new="RC">＋ ใบเสร็จรับเงิน</button>
  <span style="flex:1"></span>
  <button id="dImport">นำเข้าเอกสารจาก Excel/CSV…</button><button id="dExport">ส่งออกรายการ (Excel)</button>
 </div>
 <div class="bar"><input type="text" id="q" placeholder="ค้นหา เลขที่ / ลูกค้า"><select id="fType"></select><select id="fStatus"></select><span id="sumLbl" class="hint"></span></div>
 <table id="docTbl"></table>
</div>
<!-- ============ EDITOR ============ -->
<div class="view" id="v_edit">
 <div class="bar"><button id="eBack">← กลับ</button><button class="primary" id="eSave">บันทึก</button><button id="ePrint">🖨 พิมพ์ / PDF</button>
  <select id="eConv" style="width:auto"><option value="">แปลงเป็น…</option></select><span id="eNo" style="font-weight:700"></span></div>
 <div class="card"><div class="grid">
  <div><label>ลูกค้า</label><input type="text" id="e_cust" list="custList" placeholder="พิมพ์เพื่อค้นหา หรือชื่อใหม่"><datalist id="custList"></datalist></div>
  <div><label>วันที่</label><input type="date" id="e_date"></div>
  <div><label id="e_dueLbl">ครบกำหนด / ยืนราคา (วัน)</label><input type="number" id="e_due" min="0"></div>
  <div><label>สถานะ</label><select id="e_status"></select></div>
  <div><label>อ้างอิง (เลขที่ PO / เอกสารต้นทาง)</label><input type="text" id="e_ref"></div>
 </div>
 <div class="grid" style="margin-top:8px"><div><label>ที่อยู่ลูกค้า (แก้เฉพาะใบนี้ได้)</label><textarea id="e_addr" rows="2"></textarea></div>
  <div><label>เลขผู้เสียภาษี / สาขา</label><input type="text" id="e_tax"></div></div></div>
 <div class="card"><div class="bar"><b>รายการ</b><button id="iAdd">＋ เพิ่มแถว</button><button id="iProd">＋ จากสินค้า</button><button id="iImport">นำเข้ารายการจาก Excel/CSV…</button></div>
  <div style="overflow:auto"><table id="items"></table></div></div>
 <div class="card"><div class="grid">
  <div><label>ส่วนลดท้ายบิล</label><div style="display:flex;gap:4px"><input type="number" id="e_disc" min="0" step="any"><select id="e_discT" style="width:70px"><option value="amt">บาท</option><option value="pct">%</option></select></div></div>
  <div><label>VAT</label><select id="e_vatMode"><option value="exclusive">ราคายังไม่รวม VAT (บวกเพิ่ม)</option><option value="inclusive">ราคารวม VAT แล้ว (แยกออก)</option><option value="none">ไม่มี VAT</option></select></div>
  <div><label>อัตรา VAT (%)</label><input type="number" id="e_vat" step="any" min="0"></div>
  <div><label>หัก ณ ที่จ่าย (%)</label><select id="e_wht"><option value="0">ไม่หัก</option><option value="1">1% (ขนส่ง)</option><option value="2">2% (โฆษณา)</option><option value="3">3% (บริการ)</option><option value="5">5% (ค่าเช่า)</option></select></div>
 </div>
 <div class="grid" style="margin-top:8px"><div><label>หมายเหตุ / เงื่อนไข</label><textarea id="e_note" rows="3"></textarea></div>
  <div class="tot" id="tot"></div></div></div>
</div>
<!-- ============ CUSTOMERS / PRODUCTS ============ -->
<div class="view" id="v_cust"><div class="bar"><button class="primary" id="cAdd">＋ เพิ่มลูกค้า</button><button id="cImport">นำเข้าจาก Excel/CSV…</button><button id="cTpl">ดาวน์โหลดไฟล์ตัวอย่าง</button><input type="text" id="cq" placeholder="ค้นหา" style="width:200px"></div><table id="custTbl"></table></div>
<div class="view" id="v_prod"><div class="bar"><button class="primary" id="pAdd">＋ เพิ่มสินค้า/บริการ</button><button id="pImport">นำเข้าจาก Excel/CSV…</button><button id="pTpl">ดาวน์โหลดไฟล์ตัวอย่าง</button><input type="text" id="pq" placeholder="ค้นหา" style="width:200px"></div><table id="prodTbl"></table></div>
<!-- ============ SETTINGS ============ -->
<div class="view" id="v_set">
 <div class="card"><h3>ข้อมูลบริษัทของเรา (แสดงบนหัวเอกสาร)</h3><div class="grid f">
  <div><label>ชื่อบริษัท / ชื่อร้าน</label><input type="text" id="s_name"></div>
  <div><label>เลขประจำตัวผู้เสียภาษี</label><input type="text" id="s_tax"></div>
  <div><label>สาขา</label><input type="text" id="s_branch" placeholder="สำนักงานใหญ่"></div>
  <div><label>โทร / อีเมล</label><input type="text" id="s_contact"></div>
  <div style="grid-column:1/-1"><label>ที่อยู่</label><textarea id="s_addr" rows="2"></textarea></div>
  <div style="grid-column:1/-1"><label>บัญชีธนาคาร (แสดงท้ายเอกสาร)</label><textarea id="s_bank" rows="2"></textarea></div>
  <div><label>โลโก้</label><input type="file" id="s_logoF" accept="image/*"><button id="s_logoClr" style="margin-top:4px">ล้างโลโก้</button></div>
  <div><label>สีเอกสาร</label><input type="color" id="s_color" style="height:34px"></div>
 </div></div>
 <div class="card"><h3>ภาษีและเลขที่เอกสาร</h3><div class="grid f">
  <div><label><input type="checkbox" id="s_vatreg"> จดทะเบียนภาษีมูลค่าเพิ่ม (VAT)</label></div>
  <div><label>อัตรา VAT ตั้งต้น (%)</label><input type="number" id="s_vatrate" step="any"></div>
  <div><label>วิธีคิด VAT ตั้งต้น</label><select id="s_vatmode"><option value="exclusive">ยังไม่รวม VAT</option><option value="inclusive">รวม VAT แล้ว</option><option value="none">ไม่มี VAT</option></select></div>
  <div><label>เครดิต/ยืนราคาตั้งต้น (วัน)</label><input type="number" id="s_due"></div>
  <div><label>คำนำหน้าเลขที่: ใบเสนอราคา</label><input type="text" id="s_pQT"></div>
  <div><label>ใบวางบิล</label><input type="text" id="s_pBL"></div>
  <div><label>ใบแจ้งหนี้/ใบกำกับภาษี</label><input type="text" id="s_pINV"></div>
  <div><label>ใบเสร็จรับเงิน</label><input type="text" id="s_pRC"></div>
  <div><label>ปีในเลขที่เอกสาร</label><select id="s_yearfmt"><option value="ce">ค.ศ. (2026)</option><option value="be">พ.ศ. (2569)</option></select></div>
  <div><label>หมายเหตุตั้งต้นท้ายเอกสาร</label><textarea id="s_note" rows="2"></textarea></div>
 </div><div class="hint" style="margin-top:8px">การตั้งค่าบันทึกอัตโนมัติ · เอกสารจัดทำโดยโปรแกรมนี้ ควรให้ผู้ทำบัญชีตรวจแบบฟอร์มใบกำกับภาษีก่อนใช้จริง</div></div>
</div>
</main>
<div id="printarea"></div><div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fImp" accept=".xlsx,.xls,.csv,.txt" hidden>
<script src="vendor/xlsx.full.min.js"></script>
<script>
"use strict";
/* ================= IndexedDB ================= */
const DB = (() => {
  let db;
  const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const st = (s, m = "readonly") => db.transaction(s, m).objectStore(s);
  return {
    open: () => new Promise((res, rej) => {
      const r = indexedDB.open("billing", 1);
      r.onupgradeneeded = () => { for (const s of ["docs", "customers", "products"]) r.result.createObjectStore(s, {keyPath: "id", autoIncrement: true}); r.result.createObjectStore("kv"); };
      r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => rej(r.error);
    }),
    all: s => rq(st(s).getAll()), get: (s, k) => rq(st(s).get(k)),
    put: (s, v, k) => rq(st(s, "readwrite").put(v, k)), del: (s, k) => rq(st(s, "readwrite").delete(k)), clear: s => rq(st(s, "readwrite").clear()),
  };
})();
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 3500); }
function dialog(html, onOk, okText = "ตกลง") {
  const d = $("dlg"), f = $("dlgForm");
  f.innerHTML = html + `<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px"><button value="cancel">ยกเลิก</button><button value="ok" class="primary">${okText}</button></div>`;
  d.onclose = () => { if (d.returnValue === "ok") onOk(f); }; d.returnValue = ""; d.showModal();
}
const TYPES = {QT: "ใบเสนอราคา", BL: "ใบวางบิล", INV: "ใบแจ้งหนี้/ใบกำกับภาษี", RC: "ใบเสร็จรับเงิน"};
const STATUS = ["ร่าง", "ส่งแล้ว", "อนุมัติ", "ชำระแล้ว", "ยกเลิก"];
const today = () => new Date().toISOString().slice(0, 10);
/* เงินเก็บเป็นสตางค์ (จำนวนเต็ม) */
const toSt = v => { const x = parseFloat(String(v).replace(/,/g, "")) || 0; return Math.round(x * 100 + (x >= 0 ? 1e-7 : -1e-7)); };
const fmt = st => (st / 100).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtN = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 4});
function bahtText(st) {
  st = Math.round(st); if (st === 0) return "ศูนย์บาทถ้วน";
  const neg = st < 0; st = Math.abs(st);
  const D = ["", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"], P = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน"];
  const part = s => { let out = ""; const l = s.length; for (let i = 0; i < l; i++) { const d = +s[i], p = l - i - 1; if (!d) continue;
    if (p === 1) out += d === 1 ? "สิบ" : d === 2 ? "ยี่สิบ" : D[d] + "สิบ";
    else if (p === 0 && d === 1 && l > 1) out += "เอ็ด"; else out += D[d] + P[p]; } return out; };
  const num = s => { s = s.replace(/^0+/, ""); if (!s) return ""; const ch = []; while (s.length) { ch.unshift(s.slice(-6)); s = s.slice(0, -6); }
    return ch.map((c, i) => { c = c.replace(/^0+/, ""); return (c ? part(c) : "") + (i < ch.length - 1 ? "ล้าน" : ""); }).join(""); };
  const baht = Math.floor(st / 100), sa = st % 100;
  let t = (baht ? num(String(baht)) + "บาท" : "") + (sa ? num(String(sa)) + "สตางค์" : "ถ้วน");
  if (!sa && !baht) t = "ศูนย์บาทถ้วน";
  return (neg ? "ลบ" : "") + t;
}
/* ================= calculation ================= */
function calc(doc) {
  let sub = 0, subV = 0; const lines = [];
  for (const it of doc.items) {
    const gross = Math.round(it.qty * toSt(it.price));
    let disc = it.discT === "pct" ? Math.round(gross * (+it.disc || 0) / 100) : toSt(it.disc);
    disc = Math.min(Math.max(disc, 0), Math.max(gross, 0));
    const net = gross - disc; lines.push({gross, disc, net});
    sub += net; if (it.vat !== false) subV += net;
  }
  let dd = doc.discT === "pct" ? Math.round(sub * (+doc.disc || 0) / 100) : toSt(doc.disc);
  dd = Math.min(Math.max(dd, 0), Math.max(sub, 0));
  const ddV = sub ? Math.round(dd * subV / sub) : 0, ddN = dd - ddV;
  const afterV = subV - ddV, afterN = (sub - subV) - ddN, after = afterV + afterN;
  const rate = +doc.vatRate || 0; let base, vat, total;
  if (doc.vatMode === "none" || !rate) { vat = 0; base = after; total = after; }
  else if (doc.vatMode === "inclusive") { const bV = Math.round(afterV * 100 / (100 + rate)); vat = afterV - bV; base = bV + afterN; total = after; }
  else { vat = Math.round(afterV * rate / 100); base = after; total = after + vat; }
  const wht = Math.round(base * (+doc.wht || 0) / 100);
  return {lines, sub, dd, after, base, vat, total, wht, pay: total - wht};
}
/* ================= state ================= */
const S = {settings: null, docs: [], cust: [], prod: [], doc: null, view: "docs"};
const DEFAULTS = {name: "", tax: "", branch: "สำนักงานใหญ่", contact: "", addr: "", bank: "", logo: "", color: "#1d4ed8", vatreg: true, vatrate: 7, vatmode: "exclusive", due: 30, pQT: "QT", pBL: "BL", pINV: "INV", pRC: "RC", yearfmt: "ce", note: ""};
async function loadAll() {
  S.settings = Object.assign({}, DEFAULTS, await DB.get("kv", "settings"));
  [S.docs, S.cust, S.prod] = await Promise.all([DB.all("docs"), DB.all("customers"), DB.all("products")]);
  S.docs.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id - a.id);
  $("custList").innerHTML = S.cust.map(c => `<option value="${esc(c.name)}">`).join("");
}
/* ================= navigation ================= */
function show(v) {
  S.view = v;
  document.querySelectorAll(".view").forEach(e => e.classList.toggle("on", e.id === "v_" + v));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v || (v === "edit" && b.dataset.v === "docs")));
  ({docs: renderDocs, cust: renderCust, prod: renderProd, set: renderSettings}[v] || (() => {}))();
}
$("nav").onclick = e => { if (e.target.dataset.v) show(e.target.dataset.v); };
/* ================= document list ================= */
$("fType").innerHTML = `<option value="">ทุกประเภท</option>` + Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
$("fStatus").innerHTML = `<option value="">ทุกสถานะ</option>` + STATUS.map(s => `<option>${s}</option>`).join("");
for (const id of ["q", "fType", "fStatus"]) $(id).oninput = () => renderDocs();
function renderDocs() {
  const q = $("q").value.trim().toLowerCase(), ft = $("fType").value, fs = $("fStatus").value;
  const rows = S.docs.filter(d => (!ft || d.type === ft) && (!fs || d.status === fs) && (!q || (d.no + " " + d.custName).toLowerCase().includes(q)));
  let sum = 0;

async function readSheet(file) {

  let wb;
  if (/\.(csv|txt)$/i.test(file.name)) {
    let text; try { text = new TextDecoder("utf-8", {fatal: true}).decode(buf); } catch { text = new TextDecoder("windows-874").decode(buf); }
    wb = XLSX.read(text.replace(/^﻿/, ""), {type: "string", raw: true});
  } else wb = XLSX.read(buf, {type: "array", cellDates: true});
  const ws = wb.Sheets[wb.SheetNames[0]];

}

  phone: ["โทร", "โทรศัพท์", "เบอร์โทร", "phone", "tel"], email: ["อีเมล", "email", "mail"], credit: ["เครดิต", "เครดิตวัน", "credit", "creditdays"],
  code: ["รหัส", "รหัสสินค้า", "code", "sku"], unit: ["หน่วย", "unit", "uom"], price: ["ราคา", "ราคาต่อหน่วย", "ราคา/หน่วย", "unitprice", "price"],
  qty: ["จำนวน", "qty", "quantity"], disc: ["ส่วนลด", "discount", "disc"], vat: ["vat", "มีvat", "ภาษี"],
  ref: ["กลุ่ม", "เลขที่อ้างอิง", "ref", "group", "docref", "เลขที่เอกสาร", "docno", "เลขที่"], customer: ["ลูกค้า", "ชื่อลูกค้า", "customer", "client"],

}
$("iImport").onclick = () => pickFile(rows => { const it = rowsToItems(rows); if (!it.length) return toast("ไม่พบคอลัมน์ 'ชื่อ/รายการ' ในไฟล์"); S.doc.items = [...S.doc.items.filter(x => x.name || x.price), ...it]; renderItems(); toast(`นำเข้า ${it.length} รายการ`); });
// นำเข้าเอกสารหลายใบ: 1 แถว = 1 รายการ, แถวที่มี "กลุ่ม/เลขที่อ้างอิง" เดียวกันรวมเป็นเอกสารเดียว
$("dImport").onclick = () => dialog(`<div class="f"><label>ประเภทเอกสารที่จะสร้าง</label><select name="t">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
 <p class="hint">ไฟล์ 1 แถว = 1 รายการสินค้า คอลัมน์: <b>กลุ่ม</b> (แถวที่ค่าเหมือนกันจะรวมเป็นเอกสารใบเดียว), <b>ลูกค้า</b>, <b>วันที่</b> (ไม่บังคับ), <b>ชื่อ/รายการ, จำนวน, หน่วย, ราคา, ส่วนลด, VAT</b><br>ถ้าไม่มีคอลัมน์ "กลุ่ม" จะรวมตามชื่อลูกค้า</p>`, f => { const type = f.t.value; pickFile(rows => importDocs(rows, type)); }, "เลือกไฟล์…");
async function importDocs(rows, type) {
  const groups = new Map();
  for (const r of rows) { const m = mapRow(r, ["ref", "customer", "date"]); const cust = String(m.customer || "").trim(); if (!cust) continue; const key = String(m.ref || "").trim() || cust; if (!groups.has(key)) groups.set(key, {cust, date: m.date, rows: []}); groups.get(key).rows.push(r); }
  let n = 0, skipped = 0;
  for (const g of groups.values()) {
    const items = rowsToItems(g.rows); if (!items.length) { skipped++; continue; }
    await loadAll(); const c = S.cust.find(x => x.name === g.cust), s = S.settings;
    let date = /^\d{4}-\d{2}-\d{2}$/.test(String(g.date || "")) ? g.date : today();
    const d = {type, no: "", date, due: c?.credit || s.due, status: "ร่าง", custId: c?.id || null, custName: g.cust, custAddr: c?.addr || "", custTax: c ? [c.tax, c.branch].filter(Boolean).join(" / ") : "", ref: "", items, disc: 0, discT: "amt", vatMode: s.vatreg ? s.vatmode : "none", vatRate: s.vatrate, wht: 0, note: s.note};
    d.no = nextNo(type, date); if (!d.custId) d.custId = c?.id || await DB.put("customers", {name: g.cust}); await DB.put("docs", d); n++;
  }
  await loadAll(); renderDocs(); toast(`สร้างเอกสาร ${n} ใบ` + (skipped ? ` (ข้าม ${skipped} กลุ่มที่ไม่มีรายการ)` : ""));
}
$("dExport").onclick = () => {
  const rows = S.docs.map(d => { const c = calc(d); return {"เลขที่": d.no, "ประเภท": TYPES[d.type], "วันที่": d.date, "ลูกค้า": d.custName, "ก่อน VAT": c.base / 100, "VAT": c.vat / 100, "ยอดรวมสุทธิ": c.total / 100, "หัก ณ ที่จ่าย": c.wht / 100, "ต้องชำระ": c.pay / 100, "สถานะ": d.status, "อ้างอิง": d.ref}; });
  if (!rows.length) return toast("ยังไม่มีเอกสาร"); sampleFile(`documents-${today()}.xlsx`, rows);
};
/* ================= customers / products ================= */
function renderCust() {
  const q = $("cq").value.trim().toLowerCase();
  $("custTbl").innerHTML = `<tr><th>ชื่อ</th><th>ที่อยู่</th><th>เลขผู้เสียภาษี</th><th>สาขา</th><th>โทร</th><th>เครดิต</th><th></th></tr>` +
    S.cust.filter(c => !q || JSON.stringify(c).toLowerCase().includes(q)).map(c => `<tr class="click" data-id="${c.id}"><td>${esc(c.name)}</td><td>${esc(c.addr)}</td><td>${esc(c.tax)}</td><td>${esc(c.branch)}</td><td>${esc(c.phone)}</td><td>${c.credit || ""}</td><td><button class="danger" data-del="${c.id}">ลบ</button></td></tr>`).join("");
}
function editCust(c) {
  c = c || {}; const v = k => esc(c[k] ?? "");
  dialog(`<div class="f" style="display:grid;gap:6px"><label>ชื่อ</label><input type="text" name="name" value="${v("name")}"><label>ที่อยู่</label><textarea name="addr" rows="2">${v("addr")}</textarea>
   <label>เลขผู้เสียภาษี</label><input type="text" name="tax" value="${v("tax")}"><label>สาขา</label><input type="text" name="branch" value="${v("branch")}"><label>โทร</label><input type="text" name="phone" value="${v("phone")}"><label>อีเมล</label><input type="text" name="email" value="${v("email")}"><label>เครดิต (วัน)</label><input type="number" name="credit" value="${v("credit")}"></div>`,
  async f => { if (!f.name.value.trim()) return; await DB.put("customers", {...c, name: f.name.value.trim(), addr: f.addr.value, tax: f.tax.value, branch: f.branch.value, phone: f.phone.value, email: f.email.value, credit: +f.credit.value || 0}); await loadAll(); renderCust(); });
}
$("cAdd").onclick = () => editCust(); $("cq").oninput = renderCust;
$("custTbl").onclick = async e => { if (e.target.dataset.del) { if (confirm("ลบลูกค้า? (เอกสารเก่ายังเก็บชื่อและที่อยู่ไว้)")) { await DB.del("customers", +e.target.dataset.del); await loadAll(); renderCust(); } return; } const tr = e.target.closest("tr[data-id]"); if (tr) editCust(S.cust.find(c => c.id === +tr.dataset.id)); };
$("cImport").onclick = () => pickFile(importCust);
$("cTpl").onclick = () => sampleFile("ตัวอย่าง-ลูกค้า.xlsx", [{"ชื่อ": "บริษัท ตัวอย่าง จำกัด", "ที่อยู่": "123 ถ.สุขุมวิท กรุงเทพ 10110", "เลขผู้เสียภาษี": "0105500000000", "สาขา": "สำนักงานใหญ่", "โทร": "02-000-0000", "อีเมล": "a@example.com", "เครดิต": 30}]);
function renderProd() {
  const q = $("pq").value.trim().toLowerCase();
  $("prodTbl").innerHTML = `<tr><th>รหัส</th><th>ชื่อ</th><th>หน่วย</th><th class="n">ราคา</th><th>VAT</th><th></th></tr>` +
    S.prod.filter(p => !q || JSON.stringify(p).toLowerCase().includes(q)).map(p => `<tr class="click" data-id="${p.id}"><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="n">${fmt(toSt(p.price))}</td><td>${p.vat === false ? "ยกเว้น" : "มี"}</td><td><button class="danger" data-del="${p.id}">ลบ</button></td></tr>`).join("");
}
function editProd(p) {
  p = p || {vat: true}; const v = k => esc(p[k] ?? "");
  dialog(`<div class="f" style="display:grid;gap:6px"><label>รหัส</label><input type="text" name="code" value="${v("code")}"><label>ชื่อ</label><input type="text" name="name" value="${v("name")}"><label>หน่วย</label><input type="text" name="unit" value="${v("unit")}"><label>ราคา/หน่วย</label><input type="number" step="any" name="price" value="${v("price")}"><label><input type="checkbox" name="vat" ${p.vat !== false ? "checked" : ""}> มี VAT</label></div>`,
  async f => { if (!f.name.value.trim()) return; await DB.put("products", {...p, code: f.code.value, name: f.name.value.trim(), unit: f.unit.value, price: parseFloat(f.price.value) || 0, vat: f.vat.checked}); await loadAll(); renderProd(); });
}
$("pAdd").onclick = () => editProd(); $("pq").oninput = renderProd;
$("prodTbl").onclick = async e => { if (e.target.dataset.del) { if (confirm("ลบสินค้า?")) { await DB.del("products", +e.target.dataset.del); await loadAll(); renderProd(); } return; } const tr = e.target.closest("tr[data-id]"); if (tr) editProd(S.prod.find(p => p.id === +tr.dataset.id)); };
$("pImport").onclick = () => pickFile(importProd);
$("pTpl").onclick = () => sampleFile("ตัวอย่าง-สินค้า.xlsx", [{"รหัส": "A001", "ชื่อ": "ค่าออกแบบ", "หน่วย": "งาน", "ราคา": 15000, "VAT": "มี"}, {"รหัส": "A002", "ชื่อ": "ค่าขนส่ง (ยกเว้น VAT)", "หน่วย": "เที่ยว", "ราคา": 500, "VAT": "ไม่มี"}]);
/* ================= settings ================= */
const SMAP = ["name", "tax", "branch", "contact", "addr", "bank", "color", "vatrate", "vatmode", "due", "pQT", "pBL", "pINV", "pRC", "yearfmt", "note"];
function renderSettings() { const s = S.settings; for (const k of SMAP) $("s_" + k).value = s[k] ?? ""; $("s_vatreg").checked = !!s.vatreg; }
const saveSettings = () => DB.put("kv", S.settings, "settings");
for (const k of SMAP) $("s_" + k).addEventListener("input", () => { const el = $("s_" + k); S.settings[k] = el.type === "number" ? (+el.value || 0) : el.value; saveSettings(); });
$("s_vatreg").onchange = e => { S.settings.vatreg = e.target.checked; saveSettings(); };
$("s_logoF").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.settings.logo = r.result; saveSettings(); toast("ตั้งโลโก้แล้ว"); }; r.readAsDataURL(f); };
$("s_logoClr").onclick = () => { S.settings.logo = ""; saveSettings(); };
/* ================= backup ================= */
$("bBackup").onclick = async () => {
  const out = {v: 1, settings: S.settings, docs: await DB.all("docs"), customers: await DB.all("customers"), products: await DB.all("products")};
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type: "application/json"})); a.download = `billing-backup-${today()}.json`; a.click();
};
$("bRestore").onclick = () => $("fRestore").click();
$("fRestore").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !confirm("กู้คืนจะแทนที่ข้อมูลทั้งหมด ดำเนินการต่อ?")) return;
  try { const d = JSON.parse(await f.text()); for (const s of ["docs", "customers", "products"]) await DB.clear(s);
    for (const x of d.docs) await DB.put("docs", x); for (const x of d.customers) await DB.put("customers", x); for (const x of d.products) await DB.put("products", x);
    await DB.put("kv", d.settings, "settings"); await loadAll(); show("docs"); toast("กู้คืนแล้ว"); } catch { toast("ไฟล์สำรองไม่ถูกต้อง"); }
};
/* ================= boot ================= */
(async () => { await DB.open(); await loadAll(); if (!S.settings.name && !(await DB.get("kv", "settings"))) { await saveSettings(); show("set"); toast("เริ่มต้น: กรอกข้อมูลบริษัทและตั้งค่า VAT ก่อน"); } else show("docs"); })();
</script>
</body>
